      <div style="font-size:13px;color:#6b6b67;margin-bottom:1.25rem">${hc?'A required column is missing.':'Affected sections will show zeros or be hidden.'}</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:1.25rem">
        <thead><tr>
          <th style="text-align:left;padding:0 8px 6px 0;color:#6b6b67;font-size:11px;text-transform:uppercase;border-bottom:0.5px solid rgba(0,0,0,.1)">Section</th>
          <th style="text-align:left;padding:0 8px 6px 0;color:#6b6b67;font-size:11px;text-transform:uppercase;border-bottom:0.5px solid rgba(0,0,0,.1)">Missing</th>
          <th style="text-align:left;padding:0 0 6px 0;color:#6b6b67;font-size:11px;text-transform:uppercase;border-bottom:0.5px solid rgba(0,0,0,.1)">Impact</th>
        </tr></thead>
        <tbody>${result.missing.map(m=>`<tr>
          <td style="padding:5px 8px 5px 0;border-bottom:0.5px solid rgba(0,0,0,.06);font-weight:500;color:${m.critical?'#a32d2d':'#1a1a18'}">${m.label}</td>
          <td style="padding:5px 8px 5px 0;border-bottom:0.5px solid rgba(0,0,0,.06);font-family:monospace;font-size:11px">${m.cols.join('<br>')}</td>
          <td style="padding:5px 0;border-bottom:0.5px solid rgba(0,0,0,.06);color:#6b6b67">${m.affects}</td>
        </tr>`).join('')}</tbody>
      </table>
      ${result.unexpected.length?`<div style="font-size:12px;color:#6b6b67;margin-bottom:1rem"><b>Unrecognized columns (${result.unexpected.length}):</b> ${result.unexpected.slice(0,8).join(', ')}${result.unexpected.length>8?'…':''}</div>`:''}
      <div style="display:flex;gap:8px">
        ${!hc?`<button id="btn-cont" style="padding:6px 16px;background:#185fa5;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer">Load anyway</button>`:''}
        <button id="btn-canc" style="padding:6px 16px;background:none;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;font-size:13px;cursor:pointer">Cancel</button>
      </div>
    </div>`;
  if(!hc)document.getElementById('btn-cont').addEventListener('click',()=>{document.getElementById('uerr').innerHTML='';onContinue();});
  document.getElementById('btn-canc').addEventListener('click',()=>{document.getElementById('uerr').innerHTML='';document.getElementById('fi').value='';});
}

/* ── provider setup step ── */
function showProviderSetup(rows, onContinue){
  const providers=[...new Set(rows.map(r=>g(r,'provider')).filter(Boolean))].sort();
  const defaultExcluded=new Set(DEFAULT_EXCLUDED.filter(p=>providers.includes(p)));

  const html=`
    <div style="background:#fff;border-radius:12px;border:0.5px solid rgba(0,0,0,.1);padding:1.5rem;margin-top:1rem;max-width:600px">
      <div style="font-size:15px;font-weight:500;margin-bottom:.35rem">Configure providers</div>
      <div style="font-size:13px;color:#6b6b67;margin-bottom:1.25rem">
        Check the providers to <b>include</b> in the dashboard. Some programs are unchecked by default — you can adjust this here or any time using Manage providers in the dashboard header.
      </div>
      <div style="display:flex;gap:8px;margin-bottom:.75rem">
        <button id="psetup-all" style="font-size:12px;color:#185fa5;background:none;border:none;cursor:pointer;padding:0">Select all</button>
        <span style="color:#d3d1c7">|</span>
        <button id="psetup-none" style="font-size:12px;color:#185fa5;background:none;border:none;cursor:pointer;padding:0">Select none</button>
      </div>
      <div id="psetup-list" style="max-height:320px;overflow-y:auto;border:0.5px solid rgba(0,0,0,.1);border-radius:8px;padding:.5rem .75rem;margin-bottom:1.25rem">
        ${providers.map(p=>{
          const checked=!defaultExcluded.has(p)?'checked':'';
          return`<label style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:0.5px solid rgba(0,0,0,.05);cursor:pointer;font-size:13px">
            <input type="checkbox" class="psetup-cb" data-p="${p.replace(/"/g,'&quot;')}" ${checked} style="accent-color:#185fa5;width:13px;height:13px;flex-shrink:0">
            <span>${p}</span>
          </label>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="psetup-go" style="padding:7px 18px;background:#185fa5;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer">Load dashboard</button>
        <button id="psetup-cancel" style="padding:7px 16px;background:none;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;font-size:13px;cursor:pointer">Cancel</button>
        <span style="font-size:12px;color:#888780;margin-left:4px" id="psetup-count">${providers.length - defaultExcluded.size} of ${providers.length} selected</span>
      </div>
    </div>`;

  document.getElementById('uerr').innerHTML=html;

  function updateCount(){
    const checked=document.querySelectorAll('.psetup-cb:checked').length;
    document.getElementById('psetup-count').textContent=checked+' of '+providers.length+' selected';
  }
  document.querySelectorAll('.psetup-cb').forEach(cb=>cb.addEventListener('change',updateCount));
  document.getElementById('psetup-all').addEventListener('click',()=>{document.querySelectorAll('.psetup-cb').forEach(cb=>cb.checked=true);updateCount();});
  document.getElementById('psetup-none').addEventListener('click',()=>{document.querySelectorAll('.psetup-cb').forEach(cb=>cb.checked=false);updateCount();});
  document.getElementById('psetup-cancel').addEventListener('click',()=>{document.getElementById('uerr').innerHTML='';document.getElementById('fi').value='';});
  document.getElementById('psetup-go').addEventListener('click',()=>{
    excludedProviders=new Set();
    providers.forEach(p=>{
      const cb=document.querySelector(`.psetup-cb[data-p="${p.replace(/"/g,'&quot;')}"]`);
      if(cb&&!cb.checked)excludedProviders.add(p);
    });
    document.getElementById('uerr').innerHTML='';
    onContinue();
  });
}

/* ── manage providers (mid-session) ── */
function showManageProviders(){
  const providers=[...new Set(allRows.map(r=>g(r,'provider')).filter(Boolean))].sort((a,b)=>{
    const sk=n=>n.replace(/^Do Good Multnomah:?\s*/i,'').toLowerCase();
    return sk(a).localeCompare(sk(b));
  });
  const overlay=document.createElement('div');
  overlay.id='mpanel-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding-top:6vh';
  overlay.innerHTML=`
    <div style="background:#fff;border-radius:14px;width:90%;max-width:560px;max-height:85vh;overflow-y:auto;padding:1.5rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.35rem">
        <div style="font-size:15px;font-weight:500">Manage providers</div>
        <button id="mpanel-close" style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b6b67;line-height:1;padding:0 2px">&#x2715;</button>
      </div>
      <div style="font-size:13px;color:#6b6b67;margin-bottom:1.1rem">Check providers to <b>include</b> in the dashboard. Changes apply immediately.</div>
      <div style="display:flex;gap:8px;margin-bottom:.75rem">
        <button id="mpanel-all" style="font-size:12px;color:#185fa5;background:none;border:none;cursor:pointer;padding:0">Select all</button>
        <span style="color:#d3d1c7">|</span>
        <button id="mpanel-none" style="font-size:12px;color:#185fa5;background:none;border:none;cursor:pointer;padding:0">Select none</button>
      </div>
      <div style="border:0.5px solid rgba(0,0,0,.1);border-radius:8px;padding:.5rem .75rem;margin-bottom:1.25rem">
        ${providers.map(p=>{
          const checked=!excludedProviders.has(p)?'checked':'';
          return`<label style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:0.5px solid rgba(0,0,0,.05);cursor:pointer;font-size:13px">
            <input type="checkbox" class="mpanel-cb" data-p="${p.replace(/"/g,'&quot;')}" ${checked} style="accent-color:#185fa5;width:13px;height:13px;flex-shrink:0">
            <span>${p}</span>
          </label>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="mpanel-apply" style="padding:7px 18px;background:#185fa5;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer">Apply</button>
        <button id="mpanel-cancel" style="padding:7px 16px;background:none;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;font-size:13px;cursor:pointer">Cancel</button>
        <span id="mpanel-count" style="font-size:12px;color:#888780;margin-left:4px">${providers.length-excludedProviders.size} of ${providers.length} included</span>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function updateCount(){
    const n=overlay.querySelectorAll('.mpanel-cb:checked').length;
    document.getElementById('mpanel-count').textContent=n+' of '+providers.length+' included';
  }
  overlay.querySelectorAll('.mpanel-cb').forEach(cb=>cb.addEventListener('change',updateCount));
  document.getElementById('mpanel-all').addEventListener('click',()=>{overlay.querySelectorAll('.mpanel-cb').forEach(cb=>cb.checked=true);updateCount();});
  document.getElementById('mpanel-none').addEventListener('click',()=>{overlay.querySelectorAll('.mpanel-cb').forEach(cb=>cb.checked=false);updateCount();});
  document.getElementById('mpanel-close').addEventListener('click',()=>overlay.remove());
  document.getElementById('mpanel-cancel').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('mpanel-apply').addEventListener('click',()=>{
    excludedProviders=new Set();
    providers.forEach(p=>{
      const cb=overlay.querySelector(`.mpanel-cb[data-p="${p.replace(/"/g,'&quot;')}"]`);
      if(cb&&!cb.checked)excludedProviders.add(p);
    });
    overlay.remove();
    buildFilterPanel();
    updateFilterUI();
    render();
  });
}
function loadSheet(wb, sheetName, fileName){
  // First scan other sheets for the report end date
  window._reportEndDate=null;
  wb.SheetNames.forEach(sn=>{
    if(sn===sheetName)return;
    try{
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      for(let ri=0;ri<Math.min(raw.length,10);ri++){
        const row=raw[ri];
        for(let ci=0;ci<row.length-1;ci++){
          const cell=String(row[ci]||'').toLowerCase().trim();
          if(cell==='end date'||cell==='end date:'){
            const dateVal=row[ci+1];
            if(dateVal){
              const parsed=typeof dateVal==='number'
                ?normDate(new Date(Math.round((dateVal-25569)*86400*1000)))
                :normDate(new Date(String(dateVal)));
              if(!isNaN(parsed.getTime())){window._reportEndDate=parsed;return;}
            }
          }
        }
      }
    }catch(e){}
  });

  const ws=wb.Sheets[sheetName];

  // Try parsing normally first
  let rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  if(!rows.length){document.getElementById('uerr').innerHTML='<div class="err">That sheet appears empty. Please pick a different sheet.</div>';return;}

  // Check if headers are on row 2 — detect by seeing if row 1 contains none of our expected columns
  // but row 2 does. We do this by checking if the first row's keys match any known column names.
  const expectedCols=new Set(Object.values(COL));
  const firstRowKeys=Object.keys(rows[0]);
  const firstRowHasHeaders=firstRowKeys.some(k=>expectedCols.has(k));

  if(!firstRowHasHeaders){
    // Try parsing with header row offset — use raw array and treat row 2 as headers
    const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(raw.length>1){
      const headers=raw[1];
      const dataRows=raw.slice(2);
      rows=dataRows.map(row=>{
        const obj={};
        headers.forEach((h,i)=>{if(h)obj[h]=row[i]??'';});
        return obj;
      });
    }
  }

  if(!rows.length){document.getElementById('uerr').innerHTML='<div class="err">That sheet appears empty after skipping header row.</div>';return;}
  const validation=validateHeaders(rows);
  showValidationWarning(validation,()=>{
    showProviderSetup(rows,()=>{
      allRows=rows;activeFilters={};pendingFilters={};period='fy';activeTab='overview';newlyServedOnly=false;
      FY_QUARTERS={};FY_START=null;FY_END=null;customStart=null;customEnd=null;
      const nsBtn=document.getElementById('ns-toggle');
      nsBtn.style.background='#fff';nsBtn.style.borderColor='rgba(0,0,0,.15)';nsBtn.style.color='#444441';nsBtn.style.fontWeight='';
      buildFiscalPeriods(rows);
      buildFilterPanel();
      document.getElementById('uwrap').style.display='none';
      document.getElementById('dash').style.display='block';
      document.getElementById('btn-manage-providers').style.display='inline';
      document.getElementById('fname-row').textContent=fileName+' / '+sheetName+' — '+rows.length.toLocaleString()+' rows';
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='overview'));
      document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('active',p.id==='tab-overview'));
      updateFilterUI();render();
    });
  });
}

function showSheetPicker(wb, fileName){
  const sheets=wb.SheetNames;
  document.getElementById('uerr').innerHTML=`
    <div style="background:#fff;border-radius:12px;border:0.5px solid rgba(0,0,0,.1);padding:1.5rem;margin-top:1rem;max-width:540px">
      <div style="font-size:15px;font-weight:500;margin-bottom:.35rem">Multiple sheets found</div>
      <div style="font-size:13px;color:#6b6b67;margin-bottom:1.1rem">This file has ${sheets.length} sheets. Pick the one that contains the client data.</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:1.25rem">
        ${sheets.map((s,i)=>`
          <button class="sheet-btn" data-si="${i}" style="text-align:left;padding:9px 14px;border:0.5px solid rgba(0,0,0,.12);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;transition:border-color .1s">
            <span style="font-weight:500">${s}</span>
            <span style="font-size:11px;color:#888780;margin-left:8px">${XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:''}).length.toLocaleString()} rows</span>
          </button>`).join('')}
      </div>
      <button id="sheet-cancel" style="padding:6px 16px;background:none;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;font-size:13px;cursor:pointer">Cancel</button>
    </div>`;
  document.querySelectorAll('.sheet-btn').forEach(btn=>{
    btn.addEventListener('mouseenter',()=>btn.style.borderColor='rgba(0,0,0,.3)');
    btn.addEventListener('mouseleave',()=>btn.style.borderColor='rgba(0,0,0,.12)');
    btn.addEventListener('click',()=>{
      document.getElementById('uerr').innerHTML='';
      loadSheet(wb,sheets[+btn.dataset.si],fileName);
    });
  });
  document.getElementById('sheet-cancel').addEventListener('click',()=>{
    document.getElementById('uerr').innerHTML='';document.getElementById('fi').value='';
  });
}

function processFile(file){
  if(!file)return;
  if(!['xlsx','xls'].includes(file.name.split('.').pop().toLowerCase())){
    document.getElementById('uerr').innerHTML='<div class="err">Please upload a .xlsx or .xls file.</div>';return;
  }
  document.getElementById('uerr').innerHTML='<div style="padding:.75rem;font-size:13px;color:#6b6b67">Parsing file...</div>';
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      if(wb.SheetNames.length>1){
        showSheetPicker(wb,file.name);
      } else {
        loadSheet(wb,wb.SheetNames[0],file.name);
      }
    }catch(err){
      document.getElementById('uerr').innerHTML=`<div class="err">Error: ${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function resetDashboard(){
  destroyCharts();allRows=[];activeFilters={};pendingFilters={};period='fy';activeTab='overview';
  FY_QUARTERS={};FY_START=null;FY_END=null;customStart=null;customEnd=null;excludedProviders=new Set();
  document.getElementById('dash').style.display='none';
  document.getElementById('uwrap').style.display='block';
  document.getElementById('btn-manage-providers').style.display='none';
  document.getElementById('uerr').innerHTML='';
  document.getElementById('fi').value='';
  document.getElementById('ftag-row').classList.remove('on');
  document.getElementById('ptoggle').innerHTML='';
  document.getElementById('dr-row').classList.remove('on');
  document.getElementById('fpanel').classList.remove('open');
  document.getElementById('filter-btn').classList.remove('has-filters');
  document.getElementById('filter-badge').style.display='none';
}

/* ── event listeners ── */
document.getElementById('fi').addEventListener('change',e=>processFile(e.target.files[0]));
document.getElementById('btn-reset').addEventListener('click',resetDashboard);
document.getElementById('btn-manage-providers').addEventListener('click',showManageProviders);
document.getElementById('ptoggle').addEventListener('click',e=>{
  const btn=e.target.closest('.pbtn');if(!btn)return;
  const p=btn.dataset.period;
  document.querySelectorAll('#ptoggle .pbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(p==='custom'){document.getElementById('dr-row').classList.add('on');return;}
  document.getElementById('dr-row').classList.remove('on');
  period=p;render();
});
document.getElementById('dr-apply').addEventListener('click',()=>{
  const s=document.getElementById('dr-start').value,e=document.getElementById('dr-end').value;
  if(!s||!e)return;
  customStart=new Date(s+'T00:00:00.000Z');customEnd=new Date(e+'T23:59:59.999Z');
  period='custom';render();
});
document.getElementById('dr-cancel').addEventListener('click',()=>{
  document.getElementById('dr-row').classList.remove('on');
  period='fy';document.querySelectorAll('#ptoggle .pbtn').forEach((b,i)=>b.classList.toggle('active',i===0));render();
});
document.getElementById('tabbar').addEventListener('click',e=>{
  const btn=e.target.closest('.tab');if(!btn)return;
  activeTab=btn.dataset.tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===btn));
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('active',p.id==='tab-'+activeTab));
  render();
});

// filter panel open/close
document.getElementById('filter-btn').addEventListener('click',e=>{
  e.stopPropagation();
  const panel=document.getElementById('fpanel');
  const opening=!panel.classList.contains('open');
  panel.classList.toggle('open');
  if(opening){
    pendingFilters={};
    Object.entries(activeFilters).forEach(([k,v])=>{pendingFilters[k]=new Set(v);});
    buildFilterPanel();
  }
});
document.getElementById('fpanel-close').addEventListener('click',()=>document.getElementById('fpanel').classList.remove('open'));
document.getElementById('fpanel-clear').addEventListener('click',()=>{clearAllFilters();document.getElementById('fpanel').classList.remove('open');});
document.getElementById('fpanel-apply').addEventListener('click',()=>{
  readPendingFromPanel();
  applyPendingFilters();
  document.getElementById('fpanel').classList.remove('open');
});
document.addEventListener('click',e=>{
  const wrap=document.getElementById('fpanel-wrap');
  if(!wrap.contains(e.target))document.getElementById('fpanel').classList.remove('open');
});

const dz=document.getElementById('dz');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');processFile(e.dataTransfer.files[0]);});
document.getElementById('btn-browse').addEventListener('click',()=>document.getElementById('fi').click());
</script>
